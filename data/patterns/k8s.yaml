# ---------------------------------------------------------------------------
# Diagram details — уровень детализации страниц Kubernetes:
#   minimal — компактная схема (как Minimal K8S_Р41 v02): swimlane кластера,
#             namespace, агрегированные «pod» по deployment, HPA; без нод.
#   middle  — макет как Middle K8S_Р41 v02: заголовок кластера (stack swimlane),
#             блок Shared Infrastructure, namespace (stack), deployments с образом/CPU/RAM,
#             HPA в ряд, master/worker ноды; без полного «full»-контейнера 1180×820.
#   full    — крупный swimlane кластера, namespace, ноды, deployment, HPA (как раньше).
# ---------------------------------------------------------------------------
'Diagram details': full

# ---------------------------------------------------------------------------
# On one page — все кластеры на одной странице DrawIO:
#   yes — одна страница, кластеры укладываются вертикально (Y_stack).
#   no  — по странице на кластер (как раньше).
# On one page title — заголовок единственной страницы (только при yes).
# ---------------------------------------------------------------------------
'On one page': yes
# 'On one page title': 'Kubernetes (все кластеры)'

# Страница minimal (холст как в Minimal K8S_Р41 v02.drawio)
k8s_pages_minimal:
  diagram_modes: [minimal]
  ext_page: >
    <diagram id="{id}" name="{name}">
      <mxGraphModel dx="902" dy="697" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="827" pageHeight="1169" math="0" shadow="0">
        <root>
          <mxCell id="0"/>
          <mxCell id="1" parent="0"/>
          <mxCell id="001" value="Kubernetes" style="group;strokeColor=default;rounded=0;strokeWidth=1;perimeterSpacing=1;fontColor=none;noLabel=1;" parent="0" vertex="1">
            <mxGeometry x="20" y="20" width="800" height="1100" as="geometry"/>
          </mxCell>
        </root>
      </mxGraphModel>
    </diagram>
  schema: 'seaf.company.ta.services.k8s'

k8s_pages_middle:
